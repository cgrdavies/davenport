[package]
name = "davenport"
version = "0.1.0"
edition = "2024"
description = "Rust MCP server bridging AI agents to Apple iCloud Calendar over CalDAV (Streamable HTTP)"

[dependencies]
anyhow = "1.0.102"
axum = "0.8.9"
bytes = "1.11.1"
chrono = { version = "0.4.44", features = ["serde"] }
fast-dav-rs = "0.4.3"
http = "1.4.1"
rmcp = { version = "1.7.0", features = ["server", "macros", "transport-streamable-http-server"] }
schemars = "1.2.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tokio = { version = "1.52.3", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.23.2", features = ["v4"] }
